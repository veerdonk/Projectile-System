# C# product rules need SonarScanner for .NET (`dotnet-sonarscanner`).
# The generic sonar-scanner-cli cannot analyze .cs. That scanner also rejects
# this file: rename it for the duration of begin/build/end.
# Mark Runtime/Editor as MAIN via Directory.Build.props (Unity csproj files are
# otherwise classified as TEST).
sonar.projectKey=com.veerdonk.projectile-system
sonar.projectName=com.veerdonk.projectile-system
sonar.host.url=http://localhost:9000
sonar.sources=Packages/com.veerdonk.projectile-system/Runtime,Packages/com.veerdonk.projectile-system/Editor
sonar.tests=Packages/com.veerdonk.projectile-system/Tests
sonar.exclusions=**/Assets/**,**/Library/**,**/Temp/**,**/Packages/com.coplaydev.unity-mcp/**,**/Samples~/**
sonar.sourceEncoding=UTF-8
